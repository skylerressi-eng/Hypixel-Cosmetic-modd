org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Toolchain for Minecraft 26.3 (verified against meta.fabricmc.net / maven.fabricmc.net on 2026-11-08)
# 26.x is unobfuscated: no mappings line, Mojang's own names are used directly.
# Per-Minecraft-version values (MC, Fabric API, Mod Menu) live in versions/<mc>.properties.
# Default target is 26.3; build another with: ./gradlew :mod:build -Pmc=26.1.2
mc=26.3
loader_version=0.20.1
loom_version=1.19.4

# Mod properties
mod_version=0.1.0
maven_group=dev.cosmeticstudio
