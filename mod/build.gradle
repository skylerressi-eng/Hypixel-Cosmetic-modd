plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Load the per-Minecraft-version properties selected with -Pmc=<version> (default in gradle.properties).
def versionFile = rootProject.file("versions/${project.mc}.properties")
if (!versionFile.exists()) throw new GradleException("No versions/${project.mc}.properties; supported: " + rootProject.file('versions').list().sort().join(', '))
def mcProps = new Properties()
versionFile.withInputStream { mcProps.load(it) }
mcProps.each { k, v -> project.ext.set(k as String, v) }

version = project.mod_version
group = project.maven_group
base { archivesName = "cosmeticstudio-mc${project.minecraft_version}" }

repositories {
	// Mod Menu (optional integration, config screen in milestone 9)
	maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Optional at runtime: we only compile against its API.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Version-specific code (APIs that differ between Minecraft versions) lives in src/mc<version>/java.
sourceSets.main.java.srcDir "src/mc${project.minecraft_version}/java"

test { useJUnitPlatform() }

// In-game automated tests (Fabric client gametest API). Run with: ./gradlew :mod:runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'cosmeticstudio-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

processResources {
	// Bundle the generated catalog (see generator/generate.py) into the jar.
	from(rootProject.file('catalog')) {
		include 'cosmetics.json', 'rune_effects.json'
		into 'assets/cosmeticstudio/catalog'
	}
	def props = [version: project.version, minecraft_dependency: project.minecraft_dependency]
	inputs.properties props
	filesMatching('fabric.mod.json') { expand props }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
