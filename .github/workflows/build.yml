name: build
on: [push, pull_request]
jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :mod:build
      - name: In-game client tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers xvfb
          xvfb-run -a ./gradlew :mod:runClientGameTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-screenshots
          path: mod/build/run/clientGameTest/screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: cosmeticstudio-jar
          path: mod/build/libs/*.jar
