name: build
on: [push, pull_request]
jobs:
  mod:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.3', '26.1.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Pmc=${{ matrix.mc }} :mod:build
      - name: In-game client tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers xvfb
          xvfb-run -a ./gradlew -Pmc=${{ matrix.mc }} :mod:runClientGameTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-screenshots-mc${{ matrix.mc }}
          path: mod/build/run/clientGameTest/screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: cosmeticstudio-mc${{ matrix.mc }}
          path: mod/build/libs/*.jar
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: docker build -f Dockerfile -t cosmetic-studio-sync ..
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Catalog files are valid JSON
        run: for f in catalog/*.json; do python3 -m json.tool "$f" > /dev/null; done
